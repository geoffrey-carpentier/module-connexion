<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - Connexion | Module Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #212529;
            background: #f8f9fa;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #007bff;
        }

        .nav {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav a {
            color: #212529;
            text-decoration: none;
            font-weight: 500;
        }

        .nav a:hover {
            color: #007bff;
        }

        .nav a.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
        }

        /* Main Content */
        .main-content {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Form Card */
        .form-card {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        .form-title {
            font-size: 1.75rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #212529;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #495057;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.25);
        }

        .form-input.error {
            border-color: #dc3545;
        }

        .form-input.success {
            border-color: #28a745;
        }

        .error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            color: #495057;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-primary:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        .form-link {
            text-align: right;
            margin-top: 1rem;
        }

        .form-link a {
            color: #007bff;
            text-decoration: none;
            font-size: 0.875rem;
        }

        .form-link a:hover {
            text-decoration: underline;
        }

        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 2rem 0;
        }

        .signup-link {
            text-align: center;
            color: #6c757d;
        }

        .signup-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: 500;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background: #212529;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav {
                display: none;
            }

            .form-card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">Module Connexion</div>
            <nav>
                <ul class="nav">
                    <li><a href="accueil-mockup.html">Accueil</a></li>
                    <li><a href="#" class="active">Connexion</a></li>
                    <li><a href="inscription-mockup.html">Inscription</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-card">
            <h1 class="form-title">Connexion</h1>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="votre@email.com"
                        required
                    >
                    <div class="error-message" id="emailError">
                        Veuillez entrer une adresse email valide
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mot de passe</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                    <div class="error-message" id="passwordError">
                        Le mot de passe est requis
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Se souvenir de moi</label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Se connecter
                </button>

                <div class="form-link">
                    <a href="#">Mot de passe oublié ?</a>
                </div>
            </form>

            <div class="divider"></div>

            <div class="signup-link">
                Pas encore de compte ? 
                <a href="inscription-mockup.html">S'inscrire</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 Module Connexion. Tous droits réservés.</p>
    </footer>

    <script>
        // Simple form validation demo
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            
            let isValid = true;
            
            // Email validation
            if (!email.value || !email.value.includes('@')) {
                email.classList.add('error');
                document.getElementById('emailError').classList.add('show');
                isValid = false;
            } else {
                email.classList.remove('error');
                email.classList.add('success');
                document.getElementById('emailError').classList.remove('show');
            }
            
            // Password validation
            if (!password.value) {
                password.classList.add('error');
                document.getElementById('passwordError').classList.add('show');
                isValid = false;
            } else {
                password.classList.remove('error');
                password.classList.add('success');
                document.getElementById('passwordError').classList.remove('show');
            }
            
            if (isValid) {
                alert('Connexion réussie ! (Simulation)');
            }
        });
    </script>
</body>
</html>
